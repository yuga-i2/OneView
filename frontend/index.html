<div class="mn"><header class="tb"><div class="pill"><span id="pt">Dashboard</span></div><span class="clk" id="ud"></span><div class="tr"><input id="gs" type="search" placeholder="Search cases or institutions"><span class="bell" id="bell" title="Overdue cases and overlaps" role="button" tabindex="0"><span id="bi"></span><i id="bc">0</i></span><button class="btn cta" id="nc">+ New complaint</button><span class="tag">Signed out</span></div></header><main id="main"></main></div></div>
<aside class="drawer" id="dr" aria-label="Case details"></aside>
<footer>Prototype with synthetic sample data. Not connected to AICTE systems. Overlap results are potential matches for officer verification, not confirmed duplicates.</footer>
<script>
const BUR=["RB","PGRC","Approval Bureau","Academic Bureau"],ST=["Pending","Under Process","Disposed","Transferred","Escalated"],CAT=["Faculty norms","Fee / admission","Infrastructure","Affiliation / approval","Student grievance","Fake claims / misinformation"],REG=["Southern","Western","Northern","Eastern","Central"];
const INST=[["1-4401001","Sri Venkateswara Institute of Technology","Southern"],["1-5502114","Maharana Pratap College of Engineering","Northern"],["1-7703220","Deccan Institute of Management & Technology","Western"],["1-3304087","Bengal School of Engineering and Technology","Eastern"],["1-6605931","Narmada Polytechnic College","Central"],["1-4408812","Kaveri Engineering College","Southern"]];
const OFF=["A. Menon","R. Sharma","S. Iyer","P. Das","K. Verma","N. Reddy"];
// id, inst idx, name as entered, hasPermId, bureau, category, status, age(days), officer, last action, next action, SLA days
const R=[[1,0,"Sri Venkateswara Institute of Technology",1,1,0,1,34,0,"Notice issued to institution","Await reply",30],
[2,0,"Sri Venkateswara Inst. of Tech.",0,0,0,0,9,1,"Complaint registered","Scrutiny of documents",30],
[3,0,"Sri Venkateswara Institute of Technology",1,2,3,1,12,2,"Approval file requested","Verify affiliation status",45],
[4,1,"Maharana Pratap College of Engineering",1,1,1,4,52,3,"Escalated to Member Secretary","Decision on show-cause",30],
[5,1,"Maharana Pratap College of Engg",0,0,1,1,20,1,"Hearing scheduled","Hearing with complainant",30],
[6,2,"Deccan Institute of Management and Technology",1,0,4,2,40,4,"Closed after institution reply","None",30],
[7,2,"Deccan Inst of Mgmt & Technology",0,1,2,1,6,5,"Inspection ordered","Inspection report",45],
[8,3,"Bengal School of Engineering and Technology",1,1,0,0,3,0,"Complaint registered","Assign to officer",30],
[9,3,"Bengal School of Engineering and Technology",1,3,4,3,25,2,"Transferred to RB","Handled by RB",30],
[10,4,"Narmada Polytechnic College",1,0,5,1,47,3,"Clarification sought","Verify website claims",30],
[11,5,"Kaveri Engineering College",1,1,3,2,60,0,"Disposed with warning","None",45],
[12,5,"Kaveri Engineering College",1,0,1,1,8,4,"Reply sought","Review reply",30],
[13,4,"Narmada Polytechnic College",1,1,0,0,28,5,"Pending allocation","Assign officer",30],
[14,2,"Deccan Institute of Management and Technology",1,3,3,1,15,1,"Data validation","Update records",45]];
const SLA_ALERT=5;let C=R.map(r=>({id:"CMP-2026-"+String(r[0]).padStart(4,"0"),inst:r[1],name:r[2],hasId:!!r[3],bur:BUR[r[4]],cat:CAT[r[5]],st:ST[r[6]],age:r[7],off:OFF[r[8]],last:r[9],next:r[10],sla:r[11],reg:INST[r[1]][2],desc:""}));
let seq=C.length,view="dash",OV={},F={q:"",b:"",r:"",c:"",s:"",f:"",t:""},toastT;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=a=>{const d=new Date();d.setDate(d.getDate()-a);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})};
const open=c=>c.st!="Disposed",late=c=>open(c)&&c.age>c.sla,soon=c=>open(c)&&!late(c)&&c.sla-c.age<=SLA_ALERT;
// ---- matching: ID (deterministic) then normalised name similarity (rule-based)
const SW=new Set(["of","the","and","for","college","inst"]);
const ab={inst:"institute",tech:"technology",engg:"engineering",mgmt:"management",univ:"university"};
const norm=s=>s.toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(w=>ab[w]||w).filter(w=>!SW.has(w));
const sim=(a,b)=>{const x=new Set(norm(a)),y=new Set(norm(b));let i=0;x.forEach(w=>y.has(w)&&i++);return i/(x.size+y.size-i||1)};
function resolve(name,pid){if(pid){const k=INST.findIndex(i=>i[0]==pid.trim());if(k>=0)return{k,how:"AICTE Permanent ID",sc:1}}
let best={k:-1,sc:0};INST.forEach((i,k)=>{const s=sim(name,i[1]);if(s>best.sc)best={k,sc:s}});
return best.sc>=.6?{k:best.k,how:"Name similarity "+Math.round(best.sc*100)+"%",sc:best.sc}:{k:-1,how:"",sc:0}}
const mapped=c=>c.hasId?{k:c.inst,how:"AICTE Permanent ID",sc:1}:resolve(c.name,"");
function overlaps(){const g={};C.filter(open).forEach(c=>{const m=mapped(c);if(m.k<0)return;(g[m.k]=g[m.k]||[]).push({c,m})});
return Object.keys(g).filter(k=>new Set(g[k].map(x=>x.c.bur)).size>1).map(k=>({k:+k,items:g[k],sc:Math.min(...g[k].map(x=>x.m.sc))}))}
const ovLive=()=>overlaps().filter(o=>OV[o.k]!="dismissed");
// ---- ui
function navOld(){const n=ovLive().filter(o=>OV[o.k]!="linked").length;
$("#nav").innerHTML=[["dash","Dashboard"],["cases","All cases"],["ov","Overlaps"+(n?`<span class="n">${n}</span>`:"")],["inst","Institutions"],["new","Register complaint"],["rep","Reports"]].map(([k,l])=>`<button class="${view==k?"on":""}" data-v="${k}">${l}</button>`).join("");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function bars(rows,tot){const m=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="bar"><span>${esc(r[0])}</span><div class="t"><i style="width:${r[1]/m*100}%"></i></div><b>${r[1]}</b></div>`).join("")}
const SC={Pending:"#e0a100","Under Process":"#f59e0b",Disposed:"#0b9b7f",Transferred:"#8a93b8",Escalated:"#d9382e"},KC=["#3b4a9e","#e0a100","#f59e0b","#0b9b7f","#8a93b8","#d9382e","#d9382e"],KI=["▦","◔","⟳","✔","⇄","▲","⏱"];
function donut(){const t=C.length,L=2*Math.PI*44;let a=0;const g=ST.map(s=>{const d=C.filter(c=>c.st==s).length/t*L,e=`<circle r="44" cx="60" cy="60" fill="none" stroke="${SC[s]}" stroke-width="16" stroke-dasharray="${d} ${L-d}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=d;return e}).join("");
return `<div class="donut"><svg width="130" height="130" viewBox="0 0 120 120" role="img" aria-label="Status split">${g}<text x="60" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${t}</text><text x="60" y="75" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">cases</text></svg><div class="lg">${ST.map(s=>`<div><s style="background:${SC[s]}"></s>${s} <b>${C.filter(c=>c.st==s).length}</b></div>`).join("")}</div></div>`}
function trend(){const w=Array.from({length:9},(_,i)=>C.filter(c=>Math.floor(c.age/7)==8-i).length),m=Math.max(2,...w),P=w.map((v,i)=>[10+i*37.5,70-v/m*58]),l=P.map(p=>p.join(",")).join(" ");
return `<svg viewBox="0 0 320 92" width="100%" role="img" aria-label="Cases received per week"><polygon points="10,70 ${l} 310,70" fill="var(--pri)" opacity=".15"/><polyline points="${l}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--pri)"><title>${w[i]} received</title></circle>`).join("")}<text x="10" y="86" font-size="9" fill="currentColor" opacity=".6">9 weeks ago</text><text x="310" y="86" text-anchor="end" font-size="9" fill="currentColor" opacity=".6">this week</text></svg>`}
function dashOld(){const o=C.filter(open),n=ovLive().filter(x=>OV[x.k]!="linked"),late_=C.filter(late),soon_=C.filter(soon);
const K=[["Total cases",C.length],["Pending",C.filter(c=>c.st=="Pending").length],["Under process",C.filter(c=>c.st=="Under Process").length],["Disposed",C.filter(c=>c.st=="Disposed").length],["Transferred",C.filter(c=>c.st=="Transferred").length],["Escalated",C.filter(c=>c.st=="Escalated").length],["Overdue",late_.length,1]];
const ag=[["0–15 days",o.filter(c=>c.age<=15).length],["16–30 days",o.filter(c=>c.age>15&&c.age<=30).length],["31–45 days",o.filter(c=>c.age>30&&c.age<=45).length],["Over 45 days",o.filter(c=>c.age>45).length]];
return `<div class="hero"><div class="hl"><span class="pulse">Live registry · synced just now</span><h2>${n.length} institution${n.length==1?"":"s"} need cross-bureau coordination</h2><p>${late_.length} cases are overdue and ${soon_.length} are nearing their timelines across ${BUR.length} Bureaus/Cells.</p><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="background:#fff;color:#1b2a5e" onclick="view='ov';render()">Review overlaps</button><button class="btn o" style="color:#fff;border-color:rgba(255,255,255,.6)" onclick="view='cases';F.s='Overdue';render()">View overdue cases</button></div></div><div class="card"><h2>Status distribution</h2>${donut()}</div></div>
<div class="grid k">${K.map((k,j)=>`<div class="card kpi" style="--c:${KC[j]}"><i>${KI[j]}</i><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
<div class="card" style="margin-top:12px"><h2>Complaints received per week</h2>${trend()}</div>
${n.length?`<div class="alert">⚠ Potential Overlapping Cases – Coordination Required <span class="mut" style="color:inherit;font-weight:400">${n.length} institution(s) with open cases in more than one Bureau/Cell</span><button class="btn sm" onclick="view='ov';render()">Review overlaps</button></div>`:`<div class="hint g" style="margin:12px 0">No unresolved overlaps.</div>`}
<div class="grid two"><div class="card"><h2>Bureau/Cell workload (open cases)</h2>${bars(BUR.map(b=>[b,o.filter(c=>c.bur==b).length]))}</div>
<div class="card"><h2>Pending case ageing</h2>${bars(ag)}</div>
<div class="card"><h2>Region-wise cases</h2>${bars(REG.map(r=>[r,C.filter(c=>c.reg==r).length]))}</div>
<div class="card"><h2>Timeline alerts</h2>${late_.concat(soon_).length?late_.concat(soon_).map(c=>`<div class="row" style="padding:5px 0;cursor:pointer" onclick="show('${c.id}')"><span class="b ${late(c)?"od":"Pending"}">${late(c)?"Overdue by "+(c.age-c.sla)+"d":"Due in "+(c.sla-c.age)+"d"}</span> ${c.id} · ${esc(INST[c.inst][1])} <span class="mut">(${c.bur})</span></div>`).join(""):"<span class=mut>No cases near their timelines.</span>"}</div></div>`}
function filtered(){return C.filter(c=>{const q=F.q.toLowerCase(),m=mapped(c);return(!q||(INST[c.inst][1]+c.name+c.id+INST[c.inst][0]).toLowerCase().includes(q))&&(!F.b||c.bur==F.b)&&(!F.r||c.reg==F.r)&&(!F.c||c.cat==F.c)&&(!F.s||(F.s=="Overdue"?late(c):c.st==F.s))&&(!F.f||c.age<=+F.f)&&(!F.t||c.age>=+F.t)})}
const sel=(id,l,a)=>`<select id="${id}" aria-label="${l}"><option value="">${l}</option>${a.map(x=>`<option ${F[id.slice(1)]==x?"selected":""}>${x}</option>`).join("")}</select>`;
function cases(){return `<div class="f"><input type="search" id="fq" placeholder="Search institution, AICTE ID or case ID" value="${esc(F.q)}">${sel("fb","Bureau/Cell",BUR)}${sel("fr","Region",REG)}${sel("fc","Category",CAT)}${sel("fs","Status",[...ST,"Overdue"])}
<input type="number" id="ff" min="0" placeholder="Max age (days)" value="${F.f}" style="width:130px"><input type="number" id="ft" min="0" placeholder="Min age (days)" value="${F.t}" style="width:130px"><button class="btn o" id="csv">Export CSV</button></div>
<div class="card tw"><table><thead><tr><th>Case ID</th><th>Institution</th><th>Bureau/Cell</th><th>Category</th><th>Status</th><th>Officer</th><th>Received</th><th>Expected disposal</th></tr></thead><tbody id="tb"></tbody></table></div>`}
function rows(){const l=filtered(),ov=new Set(ovLive().flatMap(o=>o.items.map(x=>x.c.id)));$("#tb").innerHTML=l.length?l.map(c=>`<tr tabindex="0" data-id="${c.id}"><td>${c.id}</td><td>${esc(INST[c.inst][1])}<div class="mut">${INST[c.inst][0]} · ${c.reg}</div></td><td>${c.bur}${ov.has(c.id)?' <span class="b Pending" title="Potential overlap">overlap</span>':""}</td><td>${c.cat}</td><td><span class="b ${c.st}">${c.st}</span>${late(c)?' <span class="b od">overdue</span>':""}</td><td>${c.off}</td><td>${dt(c.age)}</td><td>${dt(c.age-c.sla)}</td></tr>`).join(""):`<tr><td colspan=8 class="mut">No cases match these filters. Clear a filter to see more.</td></tr>`;
document.querySelectorAll("#tb tr[data-id]").forEach(r=>{r.onclick=()=>show(r.dataset.id);r.onkeydown=e=>e.key=="Enter"&&show(r.dataset.id)})}
function ovv(){const L=overlaps();if(!L.length)return`<div class="card">No institutions have open cases in more than one Bureau/Cell.</div>`;
return`<p class="mut">Matches use the AICTE Permanent ID first, then normalised institution names. Verify each one; these are potential matches, not confirmed duplicates.</p><div class="grid two">`+L.map(o=>{const s=OV[o.k];return`<div class="card ov"><h3>${esc(INST[o.k][1])}</h3><div class="mut">${INST[o.k][0]} · ${INST[o.k][2]} region</div>
<div style="margin:8px 0"><span class="b ${s=="linked"?"Disposed":"Pending"}">${s=="linked"?"Linked – coordination in progress":s=="dismissed"?"Marked unrelated":"Potential overlap – coordination required"}</span></div>
${o.items.map(x=>`<div class="row" style="cursor:pointer" onclick="show('${x.c.id}')"><span><b>${x.c.bur}</b> · ${x.c.id}<div class="mut">${esc(x.c.cat)} · entered as “${esc(x.c.name)}” · matched by ${x.m.how}</div></span><span class="b ${x.c.st}">${x.c.st}</span></div>`).join("")}
<div class="act"><button class="btn sm" onclick="setOV(${o.k},'linked')">Link cases and notify bureaus</button><button class="btn o sm" onclick="setOV(${o.k},'dismissed')">Not related</button></div></div>`}).join("")+"</div>"}
function setOV(k,s){OV[k]=s;toast(s=="linked"?"Cases linked. Alert sent to "+[...new Set(overlaps().find(o=>o.k==k).items.map(x=>x.c.bur))].join(" and "):"Marked as not related");render()}
function form(){return`<div class="fm"><h2>Register a complaint</h2><p class="mut" style="margin:0">OneView checks for existing open cases on the same institution as you type.</p>
<label>Institution name<input id="nm" placeholder="e.g. Sri Venkateswara Inst. of Tech."></label><label>AICTE Permanent ID (optional)<input id="pid" placeholder="e.g. 1-4401001"></label>
<label>Receiving Bureau/Cell<select id="bu">${BUR.map(b=>`<option>${b}</option>`).join("")}</select></label><label>Category<select id="ca">${CAT.map(b=>`<option>${b}</option>`).join("")}</select></label>
<label>Description<textarea id="de"></textarea></label><div id="chk"></div><div><button class="btn" id="sv">Register complaint</button></div></div>`}
function check(){const m=resolve($("#nm").value,$("#pid").value),el=$("#chk");if(m.k<0){el.innerHTML=$("#nm").value||$("#pid").value?`<div class="hint">No institution found in the registry. Check the name or ID.</div>`:"";return null}
const ex=C.filter(c=>open(c)&&mapped(c).k==m.k);el.innerHTML=`<div class="hint ${ex.length?"":"g"}"><b>${esc(INST[m.k][1])}</b> (${INST[m.k][0]}) matched by ${m.how}.${ex.length?`<br>Potential Overlapping Cases – Coordination Required. ${ex.length} open case(s): ${ex.map(c=>c.id+" ("+c.bur+", "+c.st+")").join("; ")}`:"<br>No open cases on this institution."}</div>`;return m}
function bindForm(){["nm","pid"].forEach(i=>$("#"+i).oninput=check);$("#sv").onclick=()=>{const m=check();if(!m)return toast("Enter a valid institution name or Permanent ID");seq++;
C.unshift({id:"CMP-2026-"+String(seq).padStart(4,"0"),inst:m.k,name:$("#nm").value||INST[m.k][1],hasId:!!$("#pid").value.trim(),bur:$("#bu").value,cat:$("#ca").value,st:"Pending",age:0,off:"Unassigned",last:"Complaint registered",next:"Assign officer",sla:30,reg:INST[m.k][2],desc:$("#de").value});
toast("Registered "+C[0].id);view="cases";render()}}
function inst(){return`<p class="mut">Attention score combines open cases, overdue cases and multi-bureau involvement. Select an institution to see its cases.</p><div class="grid two">${INST.map((i,k)=>{const l=C.filter(c=>c.inst==k),o=l.filter(open),sc=Math.min(100,o.length*18+l.filter(late).length*20+(new Set(o.map(c=>c.bur)).size>1?20:0)),col=sc>60?"var(--bad)":sc>30?"var(--warn)":"var(--ok)";
return`<div class="card ic" style="cursor:pointer" onclick="F.q='${i[0]}';view='cases';render()"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(i[1])}</b><div class="mut">${i[0]} · ${i[2]} region</div></div><span class="b" style="height:fit-content">${l.length} cases</span></div><div class="mut" style="margin:12px 0 4px">Attention score ${sc}/100</div><div class="risk"><i style="width:${sc}%;background:${col}"></i></div><div class="mut" style="margin-top:8px">${[...new Set(o.map(c=>c.bur))].join(" · ")||"No open cases"}</div></div>`}).join("")}</div>`}
function rep(){const ct=(a,f)=>a.map(x=>[x,C.filter(c=>f(c,x))]);const tb=(h,rs)=>`<div class="card tw"><h2>${h}</h2><table style="min-width:0"><thead><tr><th>${h.split("-")[0]}</th><th>Total</th><th>Open</th><th>Disposed</th><th>Overdue</th><th>Disposal rate</th></tr></thead><tbody>${rs.map(([n,l])=>`<tr style="cursor:default"><td>${esc(n)}</td><td>${l.length}</td><td>${l.filter(open).length}</td><td>${l.filter(c=>!open(c)).length}</td><td>${l.filter(late).length}</td><td>${l.length?Math.round(l.filter(c=>!open(c)).length/l.length*100):0}%</td></tr>`).join("")}</tbody></table></div>`;
return`<div class="grid two">${tb("Bureau-wise",ct(BUR,(c,x)=>c.bur==x))}${tb("Region-wise",ct(REG,(c,x)=>c.reg==x))}${tb("Category-wise",ct(CAT,(c,x)=>c.cat==x))}${tb("Institution-wise",INST.map((i,k)=>[i[1],C.filter(c=>c.inst==k)]))}</div>`}
function show(id){const c=C.find(x=>x.id==id),i=INST[c.inst],m=mapped(c);const rel=C.filter(x=>x.inst==c.inst&&x.id!=id);
const h=[[c.age,"Complaint received",c.bur,"Case logged under "+c.cat],[Math.max(0,c.age-1),"Assigned to "+c.off,c.bur,"Auto-assigned on intake"]];
if(c.st=="Transferred")h.push([Math.round(c.age/2),"Transferred out",c.bur,c.last]);else if(c.age>2)h.push([Math.round(c.age/2),c.last,c.bur,"Remarks recorded; documents attached"]);if(c.st=="Escalated")h.push([2,"Escalated to senior authority",c.bur,"Timeline breached"]);
$("#dr").innerHTML=`<button class="btn o sm" onclick="$('#dr').classList.remove('on')">Close</button><h2 style="margin-top:12px">${c.id}</h2><span class="b ${c.st}">${c.st}</span> ${late(c)?'<span class="b od">Overdue by '+(c.age-c.sla)+' days</span>':""}
<dl><dt>Institution</dt><dd>${esc(i[1])}</dd><dt>Permanent ID</dt><dd>${i[0]}${c.hasId?"":' <span class="mut">(resolved from name: '+m.how+")</span>"}</dd><dt>Region</dt><dd>${c.reg}</dd><dt>Category</dt><dd>${c.cat}</dd><dt>Bureau/Cell</dt><dd>${c.bur}</dd><dt>Officer</dt><dd>${c.off}</dd><dt>Received</dt><dd>${dt(c.age)}</dd><dt>Last action</dt><dd>${esc(c.last)}</dd><dt>Next action</dt><dd>${esc(c.next)}</dd><dt>Expected disposal</dt><dd>${dt(c.age-c.sla)}</dd>${c.desc?`<dt>Description</dt><dd>${esc(c.desc)}</dd>`:""}</dl>
<h2>Other cases on this institution</h2>${rel.length?rel.map(x=>`<div class="row" style="padding:4px 0;cursor:pointer" onclick="show('${x.id}')">${x.id} · ${x.bur} <span class="b ${x.st}">${x.st}</span></div>`).join(""):'<span class="mut">None</span>'}
<h2 style="margin-top:14px">Action history</h2><div class="tl">${h.map(e=>`<div><b>${esc(e[1])}</b><div class="mut">${dt(e[0])} · ${e[2]}</div><div>${esc(e[3])}</div></div>`).join("")}</div>`;$("#dr").classList.add("on")}
function toast(t){clearTimeout(toastT);document.querySelectorAll(".toast").forEach(e=>e.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);toastT=setTimeout(()=>e.remove(),3000)}
function render(){$("#dr").classList.remove("on");nav();const M=$("#main");M.innerHTML={dash,cases,ov:ovv,inst,new:form,rep}[view]();
if(view=="cases"){rows();const f=(id,k)=>{$("#"+id).oninput=e=>{F[k]=e.target.value;rows()}};f("fq","q");f("fb","b");f("fr","r");f("fc","c");f("fs","s");f("ff","f");f("ft","t");
$("#csv").onclick=()=>{const l=filtered(),t=[["Case ID","Institution","Permanent ID","Bureau","Category","Status","Officer","Age days"],...l.map(c=>[c.id,INST[c.inst][1],INST[c.inst][0],c.bur,c.cat,c.st,c.off,c.age])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");toast(l.length+" cases prepared; copied to clipboard");try{navigator.clipboard.writeText(t)}catch(e){}}}
